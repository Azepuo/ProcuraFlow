spring.application.name=service-commandes
server.port=8082

# Connexion PostgreSQL (utilise les variables du docker-compose ou les valeurs par défaut)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/db_achats_univ?currentSchema=schema_commandes}
spring.datasource.username=${DB_USER:admin_achats}
spring.datasource.password=${DB_PASSWORD:pass_secure}

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# URL du microservice Fournisseurs pour les appels REST
suppliers.service.url=${FOURNISSEURS_URL:http://localhost:8081}